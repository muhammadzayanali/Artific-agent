# Deploy Django API from this monorepo (repo root → backend/).
# If Root Directory is set to `backend` in Railway, backend/railway.toml is used instead.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash start.sh"
healthcheckPath = "/api/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
