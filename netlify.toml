# Build only the Next.js panel (not the Django backend / repo root).
[build]
  base = "frontend"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js App Router is handled by Netlify's OpenNext adapter (auto).
# In Netlify Site settings → Environment variables, set:
#   DJANGO_API_URL = https://your-django-api.example.com
