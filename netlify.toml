# Monorepo: only build the Next.js app in /frontend (ignore Django /backend).
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Required for login / API proxy against Django.
# Set this in Netlify UI → Site configuration → Environment variables
# (Production + Deploy previews):
#   Key:   DJANGO_API_URL
#   Value: https://YOUR-DJANGO-HOST
